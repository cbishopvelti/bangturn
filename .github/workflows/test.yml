name: Emulator tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      BANGLE_DIR: ${{ github.workspace }}/../bangle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sh tests/setup-emulator.sh
      - run: npm test
