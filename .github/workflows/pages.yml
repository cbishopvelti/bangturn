name: Install page
# Publishes a Bangle.js App Loader with BangTurn on it to GitHub Pages,
# so https://cbishopvelti.github.io/bangturn/ always installs the latest main.
# Needs Settings > Pages > Source set to "GitHub Actions".
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1" # weekly, to pick up App Loader and Scheduler updates
  workflow_dispatch:
  pull_request:
    paths:
      - tools/build-loader.sh
      - .github/workflows/pages.yml
      - metadata.json
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sh tools/build-loader.sh _site
      - name: Check the loader lists BangTurn
        run: node -e 'const a=require("./_site/apps.json");if(!a.some(x=>x.id==="bangturn")||!a.some(x=>x.id==="sched"))process.exit(1)'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
